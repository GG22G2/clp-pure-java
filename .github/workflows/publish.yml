name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'New release version to publish (e.g. 0.4.1). Leave empty to publish current pom.xml version.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    name: Publish Artifacts to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Update version (if input provided)
        if: "${{ inputs.release_version != '' }}"
        run: |
          mvn versions:set -DnewVersion=${{ inputs.release_version }} -DgenerateBackupPoms=false

      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.MAVEN_CENTRAL_USERNAME }}</username>
                <password>${{ secrets.MAVEN_CENTRAL_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build, Test, Sign and Deploy to Central Portal
        run: |
          mvn clean deploy -P release -DskipTests

      - name: Commit version bump and create Git Tag
        if: "${{ inputs.release_version != '' }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore(release): release ${{ inputs.release_version }}"
          git tag "v${{ inputs.release_version }}"
          git push origin main --tags
          gh release create "v${{ inputs.release_version }}" --title "v${{ inputs.release_version }}" --notes "Release v${{ inputs.release_version }} published to Maven Central."
